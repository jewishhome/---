<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פסקים וגליונות הגאון הגדול ר' עמרם פריד שליט"א</title>
    <meta name="description" content="ארכיון פסקים וגליונות אזמרה לשמך של מורינו הגאון הגדול רבי עמרם פריד שליט"א">
    <meta property="og:title" content="פסקים וגליונות הגאון הגדול ר' עמרם פריד שליט"א">
    <meta property="og:description" content="חיפוש וצפייה בכל גליונות אזמרה לשמך">

    <style>
        :root { --primary-color: #2c3e50; --bg-color: #f4f7f6; --accent-color: #27ae60; --red-donate: #c0392b; --blue-ask: #2980b9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; direction: rtl; }
        #popupAd { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 450px; background: white; border: 3px solid var(--primary-color); border-radius: 15px; padding: 30px; z-index: 1000; box-shadow: 0 0 30px rgba(0,0,0,0.3); text-align: center; }
        #popupOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; }
        .close-popup { cursor: pointer; color: #888; float: left; font-size: 24px; font-weight: bold; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; color: var(--primary-color); font-size: clamp(22px, 5vw, 32px); }
        .header h3 { margin: 8px 0; color: #7f8c8d; font-weight: normal; font-size: clamp(16px, 4vw, 20px); }
        
        .side-banners { display: flex; flex-direction: column; gap: 12px; max-width: 800px; margin: 0 auto 25px; }
        .banner-btn { padding: 15px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold; color: white !important; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; cursor: pointer; }
        .banner-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-donate { background-color: var(--red-donate); }
        .btn-ask { background-color: var(--blue-ask); }
        
        .search-box { width: 100%; max-width: 800px; display: block; margin: 0 auto 25px; padding: 15px; border-radius: 8px; border: 2px solid #bdc3c7; font-size: 18px; box-sizing: border-box; outline: none; }
        
        .container { max-width: 800px; margin: 0 auto; }
        .issue-card { background: white; border-radius: 8px; margin-bottom: 12px; border: 1px solid #e0e0e0; overflow: hidden; transition: 0.2s; cursor: pointer; }
        .issue-header { padding: 15px 20px; background: var(--primary-color); color: white; font-weight: bold; font-size: 17px; }
        .issue-subtitle { display: block; font-weight: normal; font-size: 14px; color: #ecf0f1; margin-top: 4px; }
        .issue-body { padding: 0 20px; max-height: 0; overflow: hidden; transition: 0.3s; background: #fafafa; }
        .issue-card.active .issue-body { padding: 25px; max-height: 5000px; border-top: 1px solid #eee; }
        
        .topic-item { padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 15px; color: #333; }
        .btn-link { display: inline-block; margin-top: 15px; padding: 12px 25px; background: var(--accent-color); color: white !important; text-decoration: none; border-radius: 5px; font-weight: bold; text-align: center; width: 100%; box-sizing: border-box; transition: 0.3s; }
        .btn-link:hover { background: #219150; }
        
        /* כפתור שיתוף במייל */
        .action-bar { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }
        .btn-mail { flex: 1; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: bold; text-align: center; color: white !important; background-color: #e67e22; border: none; cursor: pointer; transition: 0.2s; }
        .btn-mail:hover { opacity: 0.9; transform: translateY(-1px); }

        .footer-credit { text-align: center; margin-top: 40px; padding: 25px; font-size: 18px; color: #34495e; border-top: 2px solid #bdc3c7; font-weight: bold; background: #fff; }
        
        #loadingInfo { text-align: center; padding: 25px; border: 3px solid #e67e22; border-radius: 12px; background: #fff9f4; max-width: 600px; margin: 0 auto 25px; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #e67e22; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #scrollTopBtn { display: none; position: fixed; bottom: 30px; left: 30px; z-index: 99; font-size: 24px; border: none; outline: none; background-color: var(--accent-color); color: white; cursor: pointer; width: 50px; height: 50px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; line-height: 50px; text-align: center; }
        #scrollTopBtn:hover { background-color: #1e8449; transform: translateY(-3px); }

        /* הגדרות מיוחדות להדפסה (למקרה שמישהו לוחץ Ctrl+P במחשב) */
        @media print {
            body { background-color: white; padding: 0; }
            .side-banners, .search-box, .header h3, #popupAd, #popupOverlay, #scrollTopBtn, .btn-link, .action-bar, .footer-credit { display: none !important; }
            .issue-card { border: 1px solid #000; break-inside: avoid; margin-bottom: 20px; }
            .issue-header { background: white !important; color: black !important; border-bottom: 2px solid #000; }
            .issue-subtitle { color: #333 !important; }
            .issue-card.active .issue-body { border-top: none; }
        }
    </style>
</head>
<body>

<div id="popupOverlay" onclick="closePopup()"></div>
<div id="popupAd">
    <span class="close-popup" onclick="closePopup()">&times;</span>
    <p id="adText" style="font-size: 18px; margin: 20px 0;">ברוכים הבאים לארכיון גיליונות "אזמרה לשמך".</p>
    <a id="adLink" href="https://forms.gle/vs5McYqr3HkTaqPt6" target="_blank" class="btn-link" style="background:var(--blue-ask)">לשליחת שאלות לבית ההוראה לחצו כאן</a>
</div>

<div class="header">
    <h1>ארכיון גיליונות "אזמרה לשמך"</h1>
    <h3>פסקי מורינו הגאון הגדול רבי עמרם פריד שליט"א</h3>
</div>

<div class="side-banners">
    <a href="https://www.matara.pro/nedarimplus/online/?S=uSwj" target="_blank" class="banner-btn btn-donate">תרומות לבית ההוראה לחץ כאן</a>
    <a href="https://forms.gle/vs5McYqr3HkTaqPt6" target="_blank" class="banner-btn btn-ask">לשליחת שאלות לבית ההוראה לחצו כאן</a>
</div>

<input type="text" id="searchInput" class="search-box" placeholder="חיפוש נושא, הלכה או מספר גיליון...">

<div id="loadingInfo">
    <div class="loader"></div>
    <div id="statusText" style="font-weight: bold; font-size: 18px;">מתחבר לארכיון הנתונים...</div>
</div>

<div class="container" id="archiveContainer"></div>

<div class="footer-credit">
    האתר פותח לע"נ ר' חיים מנחם בן חיים גרבובסקי זצ"ל
</div>

<button onclick="scrollToTop()" id="scrollTopBtn" title="חזרה למעלה">↑</button>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWVHM0CJGss1XQxUVp2DFJl5aPVS4lbCRIN4wtzUHeC8Kcpu1OUjYX4agKfJ7yBAlRSg/exec";
    
    let archiveData = [];

    setTimeout(() => {
        document.getElementById('popupAd').style.display = 'block';
        document.getElementById('popupOverlay').style.display = 'block';
    }, 4000);

    // שינוי מפתח הזיכרון כדי שהשינויים יחולו מיד אצלך
    const cachedData = localStorage.getItem('azmara_v10_email_only');
    if (cachedData) {
        archiveData = JSON.parse(cachedData);
        render(archiveData);
        document.getElementById('loadingInfo').style.display = 'none';
    }

    window.handleData = function(json) {
        if (!json || !json.data) return;
        const text = json.data;
        const lines = text.split('\n');
        let newData = [];
        let current = null;

        lines.forEach(line => {
            let s = line.trim();
            if (!s || s.includes('ארכיון')) return;

            if (s.startsWith('פרסום:')) {
                const urlMatch = s.match(/https?:\/\/[^\s\]]+/);
                let cleanAd = s.replace('פרסום:', '').replace(/\[?https?:\/\/[^\s\]]+\]?/g, '').trim();
                document.getElementById('adText').innerText = cleanAd;
                if (urlMatch) document.getElementById('adLink').href = urlMatch[0];
                return;
            }

            const urlMatch = s.match(/https?:\/\/[^\s\]]+/);
            
            if (s.startsWith('גיליון')) {
                if (current) newData.push(current);
                let foundLink = urlMatch ? urlMatch[0] : "";
                let cleanTitle = s.replace(/\[?https?:\/\/[^\s\]]+\]?/g, '')
                                  .replace(/(\(לצפייה לחץ כאן\)|לצפייה לחץ כאן|לחץ כאן לצפייה|לצפיה|\[|\])/g, '')
                                  .trim();
                current = { title: cleanTitle, subtitle: "", topics: [], link: foundLink };
            } else if (current) {
                if (urlMatch && !current.link) current.link = urlMatch[0];
                let cleanLine = s.replace(/\[?https?:\/\/[^\s\]]+/g, '').replace(/[\[\]]/g, '').trim();
                if (cleanLine) {
                    if (!current.subtitle) current.subtitle = cleanLine;
                    else current.topics.push(cleanLine);
                }
            }
        });
        if (current) newData.push(current);
        
        // מיון: מספרי הגיליונות מהגדול לקטן, בלי מספר לסוף
        newData.sort((a, b) => {
            let numA = parseInt((a.title.match(/\d+/) || [0])[0], 10);
            let numB = parseInt((b.title.match(/\d+/) || [0])[0], 10);
            if (numA > 0 && numB > 0) return numB - numA; 
            if (numA > 0 && numB === 0) return -1; 
            if (numA === 0 && numB > 0) return 1; 
            return 0; 
        });
        
        archiveData = newData;
        localStorage.setItem('azmara_v10_email_only', JSON.stringify(newData));
        render(archiveData);
        document.getElementById('loadingInfo').style.display = 'none';
    };

    function render(data, term = "") {
        const container = document.getElementById('archiveContainer');
        const filtered = data.filter(i => 
            !term || 
            i.title.includes(term) || 
            i.subtitle.includes(term) || 
            i.topics.some(t => t.includes(term))
        );
        
        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 40px; font-size: 18px; color: #7f8c8d;">לא נמצאו תוצאות לחיפוש "${term}"</div>`;
            return;
        }

        container.innerHTML = filtered.map(i => {
            let mainHeader = i.subtitle ? i.subtitle : i.title;
            let subHeader = i.subtitle ? i.title : '';
            
            // הכנת קישור לשליחה במייל
            let shareText = `פסקי הלכה - ${mainHeader}\n${subHeader}\n\nלצפייה בגיליון:\n${i.link || 'אין קישור מצורף'}`;
            let mailLink = `mailto:?subject=${encodeURIComponent('גיליון מעניין: ' + mainHeader)}&body=${encodeURIComponent(shareText)}`;

            return `
            <div class="issue-card" onclick="this.classList.toggle('active')">
                <div class="issue-header">
                    ${mainHeader}
                    ${subHeader ? `<span class="issue-subtitle">${subHeader}</span>` : ''}
                </div>
                <div class="issue-body" onclick="event.stopPropagation()">
                    ${i.topics.map(t => `<div class="topic-item">${t}</div>`).join('')}
                    ${i.link ? `<a href="${i.link}" target="_blank" class="btn-link">לקריאת הגיליון המלא והורדה</a>` : ''}
                    
                    <div class="action-bar">
                        <a href="${mailLink}" target="_blank" class="btn-mail">✉️ שלח גיליון למייל</a>
                    </div>
                </div>
            </div>
            `;
        }).join('');
    }

    function closePopup() {
        document.getElementById('popupAd').style.display = 'none';
        document.getElementById('popupOverlay').style.display = 'none';
    }

    // הופעת כפתור למעלה בגלילה
    window.onscroll = function() {
        let btn = document.getElementById("scrollTopBtn");
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            btn.style.display = "block";
        } else {
            btn.style.display = "none";
        }
    };

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const script = document.createElement('script');
    script.src = SCRIPT_URL + "?callback=handleData";
    document.body.appendChild(script);

    document.getElementById('searchInput').oninput = (e) => render(archiveData, e.target.value);
</script>
</body>
</html>
